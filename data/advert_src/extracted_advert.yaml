advert_title: Systems and Innovation Manager
advert_description: "Systems and Innovation Manager Location: Agile hybrid working/Liverpool\
  \ L3 Salary: \xA356,100 \u2022 35 hours Team: Insight & Group Services We\u2019\
  re recruiting a Systems and Innovation Manager to lead the development, optimisation\
  \ and innovation of Prima\u2019s business systems. This is a key role driving efficiency,\
  \ improving user experience and ensuring our digital platforms are fit for the future.\
  \ You\u2019ll oversee our core applications, guide the Innovation Team, and work\
  \ across the organisation to deliver high-quality solutions that support customers,\
  \ colleagues and wider business goals. What you\u2019ll be doing: Leading the implementation,\
  \ development and ongoing enhancement of our business systems Driving innovation\
  \ and best-practice approaches, testing and embedding new ideas Managing third-party\
  \ system integrations, supplier relationships and software contracts Designing workflows\
  \ automations and process re-engineering Overseeing systems-related projects from\
  \ concept to delivery system documentation and user training Acting as the highest\
  \ point of escalation for complex system issues Leading, mentoring and developing\
  \ the Innovation Team Technical environment you\u2019ll work with: This role works\
  \ hands-on with a modern technical stack and a broad mix of integration and analytics\
  \ tools, including: Microsoft Power Platform \u2013 Power Apps, Power Automate,\
  \ Logic Apps Azure Data Flow and cloud-based automation SSMS, SQL, data warehousing\
  \ and reporting System testing and validation API integrations using multiple authentication\
  \ models Automation tools and system-to-system workflow design Third-party system\
  \ integrations across the organisation Problem-solving, root-cause analysis and\
  \ complex troubleshooting Business analysis and translating requirements into practical\
  \ solutions It would be beneficial if you also had knowledge of: Housing Management\
  \ Systems Case management processes Repairs and asset management systems and workflows\
  \ We\u2019re looking for someone with: Strong background in business systems and\
  \ system implementations Technical expertise across SQL, SSIS, APIs, cloud technologies\
  \ and workflow automation Excellent communication skills with the ability to translate\
  \ technical detail into business language Proven project management experience A\
  \ proactive, analytical and improvement-focused mindset Experience managing ICT\
  \ or ICT Applications teams is not essential, and support will be provided if this\
  \ is your first step into a management role Make an impact with us This is a fantastic\
  \ opportunity to shape Prima Group\u2019s digital future, lead a talented team,\
  \ and deliver real innovation across the organisation. Apply today and help us deliver\
  \ smarter systems, better experiences and a more efficient way of working. We will\
  \ review applications as they come in and may close the advert early, so we encourage\
  \ early applications"
